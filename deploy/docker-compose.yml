# Production stack for one VPS (run from backend/deploy). See ../docs/deployment.md.
#
#   cp .env.example .env                                # domains and secrets
#   docker compose build
#   docker compose up -d mysql redis
#   docker compose run --rm migrate                     # apply database migrations
#   docker compose run --rm migrate npm run admin:create # first super admin (SEED_SUPER_ADMIN_*)
#   docker compose up -d
#   bash scripts/issue-certificate.sh                   # Let's Encrypt certificate
#
# Dashboards: build each one (`npm run build` in its own project) and copy its dist/ content into
# sites/owner (institute_dashboard) and sites/admin (super_admin_web).
# Only the edge (Nginx) publishes ports. MySQL and Redis stay on the internal network.

name: edu-platform

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: 4000
  API_BASE_URL: https://${API_DOMAIN}
  CORS_ORIGINS: https://${OWNER_DOMAIN},https://${ADMIN_DOMAIN}
  TRUST_PROXY: 1
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${MYSQL_DATABASE}
  DB_USERNAME: ${MYSQL_USER}
  DB_PASSWORD: ${MYSQL_PASSWORD}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-90}
  MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET}
  MEDIA_KEY_ENCRYPTION_KEY: ${MEDIA_KEY_ENCRYPTION_KEY}
  COOKIE_SECURE: 'true'
  STORAGE_PATH: /var/lib/edu/storage
  UPLOAD_CHUNK_SIZE_MB: ${UPLOAD_CHUNK_SIZE_MB:-8}
  MAX_VIDEO_SIZE_GB: ${MAX_VIDEO_SIZE_GB:-20}
  MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-200}
  KEEP_ORIGINAL_VIDEOS: ${KEEP_ORIGINAL_VIDEOS:-false}
  HLS_RENDITIONS: ${HLS_RENDITIONS:-360,720,1080}
  HLS_SEGMENT_SECONDS: ${HLS_SEGMENT_SECONDS:-6}
  FFMPEG_PRESET: ${FFMPEG_PRESET:-veryfast}
  VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-1}
  MEDIA_ACCEL_REDIRECT: 'true'
  MEDIA_ACCEL_PREFIX: /protected-media
  ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
  SEED_SUPER_ADMIN_NAME: ${SEED_SUPER_ADMIN_NAME:-}
  SEED_SUPER_ADMIN_PHONE: ${SEED_SUPER_ADMIN_PHONE:-}
  SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-}
  SEED_DEMO_DATA: 'false'

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # BullMQ requires noeviction; AOF keeps queued jobs across restarts.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 6
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]
    logging: *logging

  # One-shot: `docker compose run --rm migrate` (prisma migrate deploy) and admin tooling.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: tools
    image: edu-platform/tools:${IMAGE_TAG:-latest}
    environment: *backend-env
    depends_on:
      mysql:
        condition: service_healthy
    networks: [internal]
    profiles: [tools]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    image: edu-platform/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend-env
    command: ['node', 'dist/server.js']
    volumes:
      - media:/var/lib/edu/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  worker:
    # Same image as the API (identical build, served from cache).
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    image: edu-platform/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend-env
    command: ['node', 'dist/workers/index.js']
    # FFmpeg transcoding: keep the API responsive by bounding the worker.
    cpus: ${WORKER_CPUS:-2}
    volumes:
      - media:/var/lib/edu/storage
    depends_on:
      api:
        condition: service_started
    healthcheck:
      disable: true
    stop_grace_period: 60s
    networks: [internal]
    logging: *logging

  edge:
    build:
      context: ./nginx
    image: edu-platform/edge:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN}
      OWNER_DOMAIN: ${OWNER_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      MAX_FILE_UPLOAD_SIZE: ${MAX_FILE_UPLOAD_SIZE:-210m}
    volumes:
      # Read-only: Nginx streams authorized media via X-Accel-Redirect.
      - media:/var/lib/edu/storage:ro
      # The dashboards' build output (dist/) of institute_dashboard and super_admin_web.
      - ./sites/owner:/usr/share/nginx/owner:ro
      - ./sites/admin:/usr/share/nginx/admin:ro
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - api
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal, public]
    logging: *logging

  # Renews the certificate twice a day (the edge reloads Nginx every 6 hours).
  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done',
      ]
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks: [public]
    logging: *logging

  backup:
    build:
      context: ..
      dockerfile: deploy/backup/Dockerfile
    image: edu-platform/backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      # Root is used so the weekly verification can restore into a scratch database.
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      BACKUP_DIR: /backups
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      VERIFY_EVERY_DAYS: ${VERIFY_EVERY_DAYS:-7}
      KEEP_DAILY: ${KEEP_DAILY:-14}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-8}
      KEEP_MONTHLY: ${KEEP_MONTHLY:-12}
      TZ: UTC
    volumes:
      # A host directory, so backups can be copied off the server (see docs/backup.md).
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks: [internal]
    logging: *logging

volumes:
  mysql-data:
  redis-data:
  media:
  certbot-conf:
  certbot-www:

networks:
  internal:
    internal: true
  public:
