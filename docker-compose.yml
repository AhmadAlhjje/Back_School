# Backend on a VPS: MariaDB, Redis, database migrations, API (port 6003), video worker, backups.
# Run in this folder (step by step: docs/deployment.md):
#
#   bash docker/init-env.sh          # once: writes .env (random passwords + the first super admin)
#   docker compose up -d --build     # builds, creates and migrates the database, starts everything
#
# Update after `git pull`: the same `docker compose up -d --build` (new migrations run first).
# The dashboards (separate projects) join the "edu-platform" network and reach the API at
# http://edu-api:6003. The database and Redis are never published outside Docker.

name: edu-backend

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: 6003
  # Address the student app uses; the video/file links the API hands out start with it.
  API_BASE_URL: http://${SERVER_ADDRESS:?set SERVER_ADDRESS in .env}:${API_PORT:-6003}
  CORS_ORIGINS: http://${SERVER_ADDRESS}:${OWNER_DASHBOARD_PORT:-6001},http://${SERVER_ADDRESS}:${ADMIN_DASHBOARD_PORT:-6002}
  # The dashboards' Nginx (private Docker addresses) passes on the real client address.
  TRUST_PROXY: uniquelocal
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_HOST: mariadb
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-edu_institute}
  DB_USERNAME: ${DB_USERNAME:-edu}
  DB_PASSWORD: ${DB_PASSWORD:?run docker/init-env.sh first}
  REDIS_URL: redis://:${REDIS_PASSWORD:?run docker/init-env.sh first}@redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?run docker/init-env.sh first}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-90}
  MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET:?run docker/init-env.sh first}
  MEDIA_KEY_ENCRYPTION_KEY: ${MEDIA_KEY_ENCRYPTION_KEY:?run docker/init-env.sh first}
  # Plain http (no domain yet): the dashboards' login cookie must not require HTTPS.
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  STORAGE_PATH: /var/lib/edu/storage
  UPLOAD_CHUNK_SIZE_MB: ${UPLOAD_CHUNK_SIZE_MB:-8}
  MAX_VIDEO_SIZE_GB: ${MAX_VIDEO_SIZE_GB:-20}
  MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-200}
  KEEP_ORIGINAL_VIDEOS: ${KEEP_ORIGINAL_VIDEOS:-false}
  HLS_RENDITIONS: ${HLS_RENDITIONS:-360,720}
  HLS_SEGMENT_SECONDS: ${HLS_SEGMENT_SECONDS:-6}
  FFMPEG_PRESET: ${FFMPEG_PRESET:-superfast}
  VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-1}
  MEDIA_ACCEL_REDIRECT: 'false'
  ENABLE_API_DOCS: 'false'
  SEED_SUPER_ADMIN_NAME: ${SEED_SUPER_ADMIN_NAME:-}
  SEED_SUPER_ADMIN_PHONE: ${SEED_SUPER_ADMIN_PHONE:-}
  SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-}
  SEED_DEMO_DATA: 'false'

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?run docker/init-env.sh first}
      # Created on the first start (empty data volume); the migrations then create the tables.
      MARIADB_DATABASE: ${DB_DATABASE:-edu_institute}
      MARIADB_USER: ${DB_USERNAME:-edu}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: '1'
      TZ: UTC
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      # Healthy only once the real server accepts TCP connections (not the init-time server).
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # BullMQ requires noeviction; AOF keeps queued jobs (video processing) across restarts.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal]
    logging: *logging

  # Runs on every `up`, then exits: creates the database if needed, applies new migrations and
  # creates the first super admin (never changes an existing account). The API waits for it.
  migrate:
    build:
      context: .
      target: tools
    image: edu-backend/tools:latest
    environment: *backend-env
    command: ['sh', '-c', 'npm run --silent db:migrate && npm run --silent db:seed']
    depends_on:
      mariadb:
        condition: service_healthy
    restart: 'no'
    networks: [internal]
    logging: *logging

  api:
    build:
      context: .
      target: runtime
    image: edu-backend/api:latest
    restart: unless-stopped
    environment: *backend-env
    command: ['node', 'dist/server.js']
    ports:
      - '${API_PORT:-6003}:6003'
    volumes:
      - media:/var/lib/edu/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      internal: {}
      edu:
        aliases: [edu-api]
    logging: *logging

  worker:
    # Same image as the API (the second build is served from cache).
    build:
      context: .
      target: runtime
    image: edu-backend/api:latest
    restart: unless-stopped
    environment: *backend-env
    # Lower CPU priority: video transcoding (FFmpeg) never slows down the API.
    command: ['nice', '-n', '10', 'node', 'dist/workers/index.js']
    volumes:
      - media:/var/lib/edu/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 60s
    networks: [internal]
    logging: *logging

  # Daily database dump at BACKUP_TIME (UTC) into ./backups, verified by a test restore weekly.
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: edu-backend/backup:latest
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      # Root, so the weekly verification can restore into a scratch database.
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_DATABASE:-edu_institute}
      BACKUP_DIR: /backups
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      VERIFY_EVERY_DAYS: ${VERIFY_EVERY_DAYS:-7}
      KEEP_DAILY: ${KEEP_DAILY:-14}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-8}
      KEEP_MONTHLY: ${KEEP_MONTHLY:-12}
      TZ: UTC
    volumes:
      - ./backups:/backups
    depends_on:
      mariadb:
        condition: service_healthy
    networks: [internal]
    logging: *logging

volumes:
  db-data:
  redis-data:
  # Uploaded files and processed (encrypted) videos.
  media:

networks:
  # Database, Redis and the backend services only; no access from outside.
  internal:
    internal: true
  # Shared with the dashboards' containers (their Nginx forwards /api to edu-api:6003).
  edu:
    name: edu-platform
